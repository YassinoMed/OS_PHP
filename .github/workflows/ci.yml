name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  p0:
    name: lint + build + test (P0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: lint
        run: |
          shellcheck --version
          make lint
      - name: build
        run: make build
      - name: test
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: build/manifest.txt
