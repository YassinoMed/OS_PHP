name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          make lint

  build:
    name: build (pipeline local)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build/report.txt
